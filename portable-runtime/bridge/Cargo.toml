[package]
name = "ocpn-portable-runtime-bridge"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
anyhow = "1.0"
wasmtime = { version = "46.0.1", default-features = false, features = [
  "anyhow",
  "async",
  "component-model",
  "cranelift",
  "runtime",
  "std",
] }
wasmtime-wasi = { version = "46.0.1", default-features = false, features = [
  "p2",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 2
panic = "abort"
strip = "debuginfo"
